name: Windows installer

on:
  push:
    branches:
      - main
      - "arena/**"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.30.x"

      - name: Install Python dependencies and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -r requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "dependency install failed" }

      - name: Run static Python checks
        shell: pwsh
        run: |
          python -m compileall -q core gui installer.py main.py setup_app.py scripts tests
          if ($LASTEXITCODE -ne 0) { throw "Python compilation check failed" }
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { throw "Python-only unit tests failed" }
          python main.py --ui-import-check
          if ($LASTEXITCODE -ne 0) { throw "GUI module import check failed" }

      - name: Build pinned Luau native host
        shell: pwsh
        run: |
          $configureOutput = & cmake -G "Visual Studio 17 2022" -S native -B build/native -A x64 -DCMAKE_BUILD_TYPE=Release 2>&1
          $configureExit = $LASTEXITCODE
          $configureOutput | ForEach-Object { Write-Host $_ }
          if ($configureExit -ne 0) {
            $diagnostic = ($configureOutput | Select-Object -Last 24) -join " | "
            Write-Output "::error title=CMake configure failed::$diagnostic"
            throw "CMake configure failed with exit code $configureExit"
          }
          $buildOutput = & cmake --build build/native --config Release --target protez-native-host --parallel 4 2>&1
          $buildExit = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Host $_ }
          if ($buildExit -ne 0) {
            $diagnostic = ($buildOutput | Select-Object -Last 24) -join " | "
            Write-Output "::error title=Native host build failed::$diagnostic"
            throw "Native host build failed with exit code $buildExit"
          }
          $native = Join-Path $PWD "build/native/host-bin/protez-native-host.exe"
          if (-not (Test-Path $native)) { throw "Native host output is missing: $native" }
          & $native --version
          if ($LASTEXITCODE -ne 0) { throw "Native host health check failed" }

      - name: Bundle pixel fonts
        shell: pwsh
        run: |
          $fontDir = Join-Path $PWD "assets/fonts"
          New-Item -ItemType Directory -Force -Path $fontDir | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/pressstart2p/PressStart2P-Regular.ttf" -OutFile (Join-Path $fontDir "PressStart2P-Regular.ttf")
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/vt323/VT323-Regular.ttf" -OutFile (Join-Path $fontDir "VT323-Regular.ttf")
          foreach ($font in @("PressStart2P-Regular.ttf", "VT323-Regular.ttf")) {
            if ((Get-Item (Join-Path $fontDir $font)).Length -lt 1000) { throw "Downloaded font is incomplete: $font" }
          }

      - name: Package the self-contained application
        shell: pwsh
        run: |
          $native = Join-Path $PWD "build/native/host-bin/protez-native-host.exe"
          $sandboxDir = (Resolve-Path "sandbox").Path
          $fontDir = (Resolve-Path "assets/fonts").Path
          $iconPath = (Resolve-Path "assets/icons/protez.ico").Path
          $appDist = Join-Path $PWD "dist"
          $appWork = Join-Path $PWD "build/pyinstaller-app"
          $appSpec = Join-Path $PWD "build/spec-app"
          $entryPoint = Join-Path $PWD "main.py"
          $arguments = @(
            "--noconfirm", "--clean", "--onefile", "--windowed", "--uac-admin",
            "--icon", $iconPath,
            "--name", "Protez",
            "--distpath", $appDist,
            "--workpath", $appWork,
            "--specpath", $appSpec,
            "--add-data", "$sandboxDir;sandbox",
            "--add-data", "$native;tools",
            "--add-data", "$fontDir;assets/fonts",
            "--add-data", "$iconPath;assets/icons",
            "--collect-all", "customtkinter",
            "--collect-all", "tkinterdnd2",
            "--hidden-import", "tkinterdnd2.TkinterDnD",
            $entryPoint
          )
          $packageOutput = & python -m PyInstaller @arguments 2>&1
          $packageExit = $LASTEXITCODE
          $packageOutput | ForEach-Object { Write-Host $_ }
          if ($packageExit -ne 0) {
            $diagnostic = ($packageOutput | Select-Object -Last 24 | ForEach-Object { $_.ToString() }) -join " | "
            Write-Output "::error title=PyInstaller app build failed::$diagnostic"
            throw "Protez.exe packaging failed with exit code $packageExit"
          }
          if (-not (Test-Path "dist/Protez.exe")) {
            Write-Output "::error title=Protez.exe missing::PyInstaller completed but dist/Protez.exe was not created"
            throw "Protez.exe was not created"
          }
          $binary = [System.IO.File]::ReadAllBytes((Resolve-Path "dist/Protez.exe"))
          $manifestAscii = [System.Text.Encoding]::ASCII.GetString($binary)
          $manifestUnicode = [System.Text.Encoding]::Unicode.GetString($binary)
          if (-not ($manifestAscii.Contains("requireAdministrator") -or $manifestUnicode.Contains("requireAdministrator"))) {
            throw "The packaged executable does not contain the required Administrator manifest"
          }
          Write-Host "Protez.exe contains the requireAdministrator manifest; it was not launched in CI."

      - name: Create self-repair installer
        shell: pwsh
        run: |
          python scripts/create_installer_manifest.py dist/Protez.exe dist/manifest.json
          if ($LASTEXITCODE -ne 0) { throw "Could not create embedded payload manifest" }
          $appExecutable = (Resolve-Path "dist/Protez.exe").Path
          $payloadManifest = (Resolve-Path "dist/manifest.json").Path
          $setupDist = Join-Path $PWD "dist/setup"
          $setupWork = Join-Path $PWD "build/pyinstaller-setup"
          $setupSpec = Join-Path $PWD "build/spec-setup"
          $entryPoint = Join-Path $PWD "setup_app.py"
          $arguments = @(
            "--noconfirm", "--clean", "--onefile", "--windowed", "--uac-admin",
            "--name", "Protez-Setup",
            "--distpath", $setupDist,
            "--workpath", $setupWork,
            "--specpath", $setupSpec,
            "--add-data", "$appExecutable;installer_payload",
            "--add-data", "$payloadManifest;installer_payload",
            $entryPoint
          )
          python -m PyInstaller @arguments
          if ($LASTEXITCODE -ne 0) { throw "Protez-Setup.exe packaging failed" }
          if (-not (Test-Path "dist/setup/Protez-Setup.exe")) { throw "Protez-Setup.exe was not created" }

      - name: Assemble distributable files
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "dist/release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item "dist/setup/Protez-Setup.exe" (Join-Path $releaseDir "Protez-Setup.exe")
          Copy-Item "dist/Protez.exe" (Join-Path $releaseDir "Protez.exe")
          $entries = foreach ($file in Get-ChildItem $releaseDir -File | Sort-Object Name) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $entries | Set-Content -Encoding utf8 (Join-Path $releaseDir "SHA256SUMS.txt")

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Protez-Windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach standalone application to GitHub Release
        if: github.event_name == 'release' && github.event.action == 'published'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" "dist/Protez.exe" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload Protez.exe to the GitHub Release" }
