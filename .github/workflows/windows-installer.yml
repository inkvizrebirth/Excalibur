name: Windows installer

on:
  push:
    branches:
      - main
      - "arena/**"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.30.x"

      - name: Check out pinned offline bytecode decompiler
        uses: actions/checkout@v4
        with:
          repository: PumbaaDev/luau-decompiler
          ref: ee07098c31e11601a9ca434bc12932a4ded65f7b
          path: build/luau-decompiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Check out pinned Lua bytecode decompiler
        uses: actions/checkout@v4
        with:
          repository: x3zvawq/unluac-rs
          ref: 3186d2e392e44a2ddaadd1826a779c98c718be53
          path: build/unluac-rs

      - name: Apply bounded Lua table-constructor recovery
        shell: pwsh
        run: |
          $patch = Join-Path $PWD "third_party/unluac-rs-protez-setlist.patch"
          git -C build/unluac-rs apply --check --unidiff-zero $patch
          if ($LASTEXITCODE -ne 0) { throw "The pinned Lua decompiler recovery patch no longer applies cleanly" }
          git -C build/unluac-rs apply --unidiff-zero $patch
          if ($LASTEXITCODE -ne 0) { throw "Could not apply the Lua decompiler recovery patch" }
          Write-Host "Applied Protez's bounded fresh-table SETLIST source recovery."

      - name: Install Python dependencies and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -r requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "dependency install failed" }

      - name: Run static Python checks
        shell: pwsh
        run: |
          python -m compileall -q core gui installer.py main.py setup_app.py scripts tests
          if ($LASTEXITCODE -ne 0) { throw "Python compilation check failed" }
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { throw "Python-only unit tests failed" }
          python main.py --ui-import-check
          if ($LASTEXITCODE -ne 0) { throw "GUI module import check failed" }

      - name: Build pinned Luau native host
        shell: pwsh
        run: |
          $configureOutput = & cmake -G "Visual Studio 17 2022" -S native -B build/native -A x64 -DCMAKE_BUILD_TYPE=Release 2>&1
          $configureExit = $LASTEXITCODE
          $configureOutput | ForEach-Object { Write-Host $_ }
          if ($configureExit -ne 0) {
            $diagnostic = ($configureOutput | Select-Object -Last 24) -join " | "
            Write-Output "::error title=CMake configure failed::$diagnostic"
            throw "CMake configure failed with exit code $configureExit"
          }
          $buildOutput = & cmake --build build/native --config Release --target protez-native-host --parallel 4 2>&1
          $buildExit = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Host $_ }
          if ($buildExit -ne 0) {
            $diagnostic = ($buildOutput | Select-Object -Last 24) -join " | "
            Write-Output "::error title=Native host build failed::$diagnostic"
            throw "Native host build failed with exit code $buildExit"
          }
          $native = Join-Path $PWD "build/native/host-bin/protez-native-host.exe"
          if (-not (Test-Path $native)) { throw "Native host output is missing: $native" }
          $ast = Join-Path $PWD "build/native/host-bin/luau-ast.exe"
          if (-not (Test-Path $ast)) { throw "Pinned Luau AST parser output is missing: $ast" }
          & $native --version
          if ($LASTEXITCODE -ne 0) { throw "Native host health check failed" }

      - name: Build offline Luau bytecode decompiler
        shell: pwsh
        run: |
          $sourceDir = Join-Path $PWD "build/luau-decompiler"
          $sourceCommit = (& git -C $sourceDir rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -ne "ee07098c31e11601a9ca434bc12932a4ded65f7b") {
            throw "Offline bytecode decompiler source checkout does not match the recorded commit: $sourceCommit"
          }
          cargo build --manifest-path (Join-Path $sourceDir "Cargo.toml") --locked --release -p luau-cli --bin luau-decompiler
          if ($LASTEXITCODE -ne 0) { throw "Offline bytecode decompiler build failed" }
          $decompiler = Join-Path $sourceDir "target/release/luau-decompiler.exe"
          if (-not (Test-Path $decompiler)) { throw "Built Luau bytecode decompiler is missing: $decompiler" }
          $version = & $decompiler --version
          if ($LASTEXITCODE -ne 0 -or "$version" -notmatch "luau-decompiler") {
            throw "Offline bytecode decompiler health check failed: $version"
          }
          Write-Host $version
          $help = (& $decompiler --help 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $help -notmatch "--output") {
            throw "Offline bytecode decompiler CLI help did not confirm the required output option"
          }
          $licenseDir = Join-Path $PWD "build/third-party"
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          Copy-Item (Join-Path $sourceDir "LICENSE") (Join-Path $licenseDir "luau-decompiler-mit.txt")
          if (-not (Test-Path (Join-Path $licenseDir "luau-decompiler-mit.txt"))) {
            throw "Could not stage the bytecode decompiler license notice"
          }
          Copy-Item (Join-Path $PWD "build/native/_deps/luau-src/LICENSE.txt") (Join-Path $licenseDir "luau-mit.txt")

      - name: Build MoonSec V3 and Lua 5.1 source lifters
        shell: pwsh
        run: |
          $moonsecProject = Join-Path $PWD "third_party/moonsec_v3_gpl/MoonsecDeobfuscator.csproj"
          dotnet publish $moonsecProject -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o build/moonsec-helper
          if ($LASTEXITCODE -ne 0) { throw "MoonSec V3 helper build failed" }
          $moonsec = Join-Path $PWD "build/moonsec-helper/protez-moonsec-v3.exe"
          if (-not (Test-Path $moonsec)) { throw "MoonSec V3 helper executable is missing: $moonsec" }
          $moonsecVersion = & $moonsec --version
          if ($LASTEXITCODE -ne 0 -or "$moonsecVersion" -notmatch "MoonsecDeobfuscator Protez V3") { throw "MoonSec helper health check failed: $moonsecVersion" }
          $unluacSource = Join-Path $PWD "build/unluac-rs"
          $unluacCommit = (& git -C $unluacSource rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $unluacCommit -ne "3186d2e392e44a2ddaadd1826a779c98c718be53") { throw "unluac-rs source checkout does not match the recorded commit: $unluacCommit" }
          cargo build --manifest-path (Join-Path $unluacSource "Cargo.toml") --locked --release -p unluac-cli
          if ($LASTEXITCODE -ne 0) { throw "unluac-rs CLI build failed" }
          $unluac = Join-Path $unluacSource "target/release/unluac-cli.exe"
          if (-not (Test-Path $unluac)) { throw "unluac-rs CLI executable is missing: $unluac" }
          $toolDir = Join-Path $PWD "build/third-party"
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          Copy-Item (Join-Path $PWD "third_party/moonsec_v3_gpl/LICENSE") (Join-Path $toolDir "moonsec-gpl-3.0.txt")
          Copy-Item (Join-Path $PWD "third_party/unluac-rs-mit.txt") (Join-Path $toolDir "unluac-rs-mit.txt")

      - name: Smoke-test Luraph and MoonSec source recovery
        shell: pwsh
        run: |
          $fixtures = Join-Path $env:RUNNER_TEMP "protez-family-fixtures"
          New-Item -ItemType Directory -Force -Path $fixtures | Out-Null
          $luraphFixture = Join-Path $fixtures "luraph-v15.lua"
          $moonsecFixture = Join-Path $fixtures "moonsec-v3.lua"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/KryptIT/luraph-v15-v14.x-deobfuscator/ed79a86cc41187af0480e69f45a4838723fdb099/Deobfuscator/samples/001_vm_like_dispatch-obfuscated.lua" -OutFile $luraphFixture -TimeoutSec 45
          Invoke-WebRequest -Uri "https://gist.githubusercontent.com/checkurasshole/1bdb0f162d79819f6a4a34d6e9f45bd3/raw/b822d7396aa18e182b581348f93a70a0cdd832fb/v12.lua" -OutFile $moonsecFixture -TimeoutSec 45
          $luraphHash = (Get-FileHash -Algorithm SHA256 $luraphFixture).Hash.ToLowerInvariant()
          $moonsecHash = (Get-FileHash -Algorithm SHA256 $moonsecFixture).Hash.ToLowerInvariant()
          if ($luraphHash -ne "838a5ec65dde4b22399d88b4dc86d6c87dcdb6c1fe18f3c8dc54cd1b366af925") { throw "Pinned Luraph fixture hash mismatch: $luraphHash" }
          if ($moonsecHash -ne "7d32c4ba8d7274619ead6e6f19857abf3eefa6abd0e3d89fcfc42505d3eafd77") { throw "Pinned MoonSec fixture hash mismatch: $moonsecHash" }
          $smokeTools = Join-Path $PWD "build/family-smoke-tools"
          New-Item -ItemType Directory -Force -Path $smokeTools | Out-Null
          Copy-Item "build/native/host-bin/protez-native-host.exe" $smokeTools
          Copy-Item "build/native/host-bin/luau-ast.exe" $smokeTools
          Copy-Item "build/moonsec-helper/protez-moonsec-v3.exe" $smokeTools
          Copy-Item "build/unluac-rs/target/release/unluac-cli.exe" $smokeTools
          python scripts/smoke_family_devirtualizers.py --luraph-fixture $luraphFixture --moonsec-fixture $moonsecFixture --tools-dir $smokeTools --work-dir (Join-Path $env:RUNNER_TEMP "protez-family-smoke")
          if ($LASTEXITCODE -ne 0) { throw "Family-specific source recovery smoke test failed" }

      - name: Package the self-contained application
        shell: pwsh
        run: |
          $native = Join-Path $PWD "build/native/host-bin/protez-native-host.exe"
          $ast = Join-Path $PWD "build/native/host-bin/luau-ast.exe"
          $decompiler = Join-Path $PWD "build/luau-decompiler/target/release/luau-decompiler.exe"
          $moonsec = Join-Path $PWD "build/moonsec-helper/protez-moonsec-v3.exe"
          $unluac = Join-Path $PWD "build/unluac-rs/target/release/unluac-cli.exe"
          $decompilerLicense = Join-Path $PWD "build/third-party/luau-decompiler-mit.txt"
          $luauLicense = Join-Path $PWD "build/third-party/luau-mit.txt"
          $luraphVendor = Join-Path $PWD "third_party/protez_luraph_v15"
          $moonsecSource = Join-Path $PWD "third_party/moonsec_v3_gpl"
          $moonsecLicense = Join-Path $PWD "build/third-party/moonsec-gpl-3.0.txt"
          $unluacLicense = Join-Path $PWD "build/third-party/unluac-rs-mit.txt"
          $thirdPartyNotices = Join-Path $PWD "third_party/THIRD_PARTY_NOTICES.md"
          $iconPath = (Resolve-Path "assets/icons/protez.ico").Path
          $appDist = Join-Path $PWD "dist"
          $appWork = Join-Path $PWD "build/pyinstaller-app"
          $appSpec = Join-Path $PWD "build/spec-app"
          $entryPoint = Join-Path $PWD "main.py"
          $arguments = @(
            "--noconfirm", "--clean", "--onefile", "--windowed",
            "--icon", $iconPath,
            "--name", "Protez",
            "--distpath", $appDist,
            "--workpath", $appWork,
            "--specpath", $appSpec,
            "--add-data", "$native;tools",
            "--add-data", "$ast;tools",
            "--add-data", "$decompiler;tools",
            "--add-data", "$moonsec;tools",
            "--add-data", "$unluac;tools",
            "--add-data", "$decompilerLicense;licenses",
            "--add-data", "$luauLicense;licenses",
            "--add-data", "$moonsecLicense;licenses",
            "--add-data", "$unluacLicense;licenses",
            "--add-data", "$thirdPartyNotices;licenses",
            "--add-data", "$luraphVendor;third_party/protez_luraph_v15",
            "--add-data", "$moonsecSource;third_party/moonsec_v3_gpl",
            "--add-data", "$iconPath;assets/icons",
            "--collect-all", "customtkinter",
            "--collect-all", "tkinterdnd2",
            "--collect-all", "zstandard",
            "--hidden-import", "tkinterdnd2.TkinterDnD",
            $entryPoint
          )
          $packageOutput = & python -m PyInstaller @arguments 2>&1
          $packageExit = $LASTEXITCODE
          $packageOutput | ForEach-Object { Write-Host $_ }
          if ($packageExit -ne 0) {
            $diagnostic = ($packageOutput | Select-Object -Last 24 | ForEach-Object { $_.ToString() }) -join " | "
            Write-Output "::error title=PyInstaller app build failed::$diagnostic"
            throw "Protez.exe packaging failed with exit code $packageExit"
          }
          if (-not (Test-Path "dist/Protez.exe")) {
            Write-Output "::error title=Protez.exe missing::PyInstaller completed but dist/Protez.exe was not created"
            throw "Protez.exe was not created"
          }
          Write-Host "Protez.exe is packaged without an elevation manifest; the analysis worker uses AppContainer isolation."

      - name: Create self-repair installer
        shell: pwsh
        run: |
          python scripts/create_installer_manifest.py dist/Protez.exe dist/manifest.json
          if ($LASTEXITCODE -ne 0) { throw "Could not create embedded payload manifest" }
          $appExecutable = (Resolve-Path "dist/Protez.exe").Path
          $payloadManifest = (Resolve-Path "dist/manifest.json").Path
          $setupDist = Join-Path $PWD "dist/setup"
          $setupWork = Join-Path $PWD "build/pyinstaller-setup"
          $setupSpec = Join-Path $PWD "build/spec-setup"
          $entryPoint = Join-Path $PWD "setup_app.py"
          $arguments = @(
            "--noconfirm", "--clean", "--onefile", "--windowed", "--uac-admin",
            "--name", "Protez-Setup",
            "--distpath", $setupDist,
            "--workpath", $setupWork,
            "--specpath", $setupSpec,
            "--add-data", "$appExecutable;installer_payload",
            "--add-data", "$payloadManifest;installer_payload",
            $entryPoint
          )
          python -m PyInstaller @arguments
          if ($LASTEXITCODE -ne 0) { throw "Protez-Setup.exe packaging failed" }
          if (-not (Test-Path "dist/setup/Protez-Setup.exe")) { throw "Protez-Setup.exe was not created" }

      - name: Assemble distributable files
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "dist/release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item "dist/setup/Protez-Setup.exe" (Join-Path $releaseDir "Protez-Setup.exe")
          Copy-Item "dist/Protez.exe" (Join-Path $releaseDir "Protez.exe")
          $entries = foreach ($file in Get-ChildItem $releaseDir -File | Sort-Object Name) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $entries | Set-Content -Encoding utf8 (Join-Path $releaseDir "SHA256SUMS.txt")

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Protez-Windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach standalone application to GitHub Release
        if: github.event_name == 'release' && github.event.action == 'published'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" "dist/Protez.exe" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload Protez.exe to the GitHub Release" }
